<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小數學知識圖譜適應性診斷系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Microsoft JhengHei', sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-custom { border-radius: 25px; padding: 10px 25px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 800px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">國小數學知識圖譜適應性診斷系統</h2>
        <p class="text-muted">精準定位學習卡點 ‧ 逐層溯源診斷</p>
    </div>

    <div id="start-card" class="card p-4 text-center">
        <h4 class="mb-3">歡迎參加六年級數學診斷測驗</h4>
        <p class="text-muted">本測驗將根據您的答題狀況，自動進行跨年級知識點的下探診斷。</p>
        <div>
            <button class="btn btn-primary btn-lg btn-custom" onclick="startMainExam()">開始測驗</button>
        </div>
    </div>

    <div id="exam-card" class="card p-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-primary fs-6" id="stage-badge">階段一：主測驗</span>
            <span class="text-muted" id="progress-text">題目 1 / 5</span>
        </div>
        <h5 class="fw-bold mb-3" id="question-title">載入中...</h5>
        <p class="fs-5 mb-4" id="question-content"></p>
        <div id="options-container" class="d-grid gap-2 mb-4"></div>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button id="prev-btn" class="btn btn-outline-secondary btn-custom" onclick="prevQuestion()">上一題</button>
            <button id="next-btn" class="btn btn-success btn-custom" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

    <div id="report-card" class="card p-4 d-none">
        <h3 class="fw-bold text-center text-primary mb-3">知識圖譜診斷報告</h3>
        <hr>
        <h5 class="fw-bold text-dark mb-3">本輪作答明細與知識點分析：</h5>
        <div id="item-breakdown-container" class="mb-4"></div>

        <div id="prereq-action-area" class="text-center p-4 bg-light border border-warning rounded d-none">
            <h5 class="fw-bold text-dark mb-2">發現尚需進一步確認的知識卡點</h5>
            <p class="text-muted mb-3" id="prereq-explanation-text">點擊下方按鈕開始進行下一階段的 5 年級前置觀念追溯測驗。</p>
            <button class="btn btn-warning btn-lg btn-custom text-white fw-bold" onclick="startPrereqRound()">進入階段 2：前置觀念追溯測驗</button>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-outline-primary btn-custom" onclick="resetSystem()">重新測驗</button>
        </div>
    </div>
</div>

<script>
    // 已自動帶入你的正確 GAS Web App API 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx_wWE_sHFKETLpfoWNg0zXxnQgxk_joBRbC913UD6eorjtHbJFxtx1NGJr9LPsj1wt/exec";

    let allDbQuestions = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};
    let activeChains = {};
    let currentPrereqQueue = [];

    // 開始主測驗
    async function startMainExam() {
        document.getElementById("start-card").classList.add("d-none");
        document.getElementById("exam-card").classList.remove("d-none");
        document.getElementById("question-title").innerText = "資料載入中，請稍候...";
        try {
            const response = await fetch(GAS_API_URL);
            allDbQuestions = await response.json();
            
            // 抓取 6 年級核心觀念題
            currentQuestions = allDbQuestions.filter(q => q.年級 == 6 || q.年級 == "6");
            currentIndex = 0;
            userAnswers = {};
            activeChains = {};
            
            currentQuestions.forEach(q => {
                activeChains[q.題目ID] = { mainQ: q, lastTestedQ: q, history: [] };
            });
            
            renderQuestion();
        } catch (error) {
            alert("載入題目失敗，請檢查 API 網址與網路連線！");
            console.error(error);
        }
    }

    // 渲染題目
    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById("stage-badge").innerText = `${q.年級}年級測驗 - ${q.核心知識點}`;
        document.getElementById("progress-text").innerText = `題目 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById("question-title").innerText = `【${q.題目ID}】 ${q.核心知識點}`;
        document.getElementById("question-content").innerText = q.題目內容;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        const rawOptions = [
            { key: 'A', text: q.選項A },
            { key: 'B', text: q.選項B },
            { key: 'C', text: q.選項C },
            { key: 'D', text: q.選項D }
        ];

        rawOptions.forEach(opt => {
            let cleanText = String(opt.text || '').replace(/^\([A-D]\)\s*/, '');
            const btn = document.createElement("button");
            btn.className = (userAnswers[q.題目ID] === opt.key) 
                ? "btn btn-primary text-start p-3 fs-6" 
                : "btn btn-outline-primary text-start p-3 fs-6";
            btn.innerText = `(${opt.key}) ${cleanText}`;
            btn.onclick = () => { userAnswers[q.題目ID] = opt.key; renderQuestion(); };
            container.appendChild(btn);
        });

        document.getElementById("prev-btn").disabled = (currentIndex === 0);
        document.getElementById("next-btn").disabled = !userAnswers[q.題目ID];
        document.getElementById("next-btn").innerText = (currentIndex === currentQuestions.length - 1) ? "完成交卷" : "下一題";
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

    function nextQuestion() {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            processRoundResults();
        }
    }

    // 處理作答結果與階段 2 下探計算
    function processRoundResults() {
        currentPrereqQueue = [];
        
        currentQuestions.forEach(q => {
            const userAns = userAnswers[q.題目ID];
            const isCorrect = (userAns === q.正確答案);
            
            let chainKey = Object.keys(activeChains).find(k => k === q.題目ID || activeChains[k].lastTestedQ.題目ID === q.題目ID);
            if (chainKey) {
                let chain = activeChains[chainKey];
                chain.history.push({ q: q, isCorrect: isCorrect });
                
                if (!isCorrect) {
                    const nextPrereqId = q.前置追溯題目ID;
                    if (nextPrereqId && nextPrereqId !== "無" && String(nextPrereqId).trim() !== "") {
                        const nextQ = allDbQuestions.find(item => String(item.題目ID).trim() === String(nextPrereqId).trim());
                        if (nextQ) {
                            chain.lastTestedQ = nextQ;
                            currentPrereqQueue.push(nextQ);
                        }
                    }
                }
            }
        });

        renderDiagnosisReport();
    }

    // 渲染報告與階段 2 觸發按鈕
    function renderDiagnosisReport() {
        document.getElementById("exam-card").classList.add("d-none");
        document.getElementById("report-card").classList.remove("d-none");
        
        const container = document.getElementById("item-breakdown-container");
        container.innerHTML = "";

        Object.keys(activeChains).forEach(chainKey => {
            const chain = activeChains[chainKey];
            const lastLog = chain.history[chain.history.length - 1];
            
            const cardDiv = document.createElement("div");
            cardDiv.className = "card mb-3 p-3 border";
            const badgeClass = lastLog.isCorrect ? "bg-success" : "bg-danger";
            const statusText = lastLog.isCorrect ? "答對" : "答錯";
            
            cardDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">[${lastLog.q.年級}年級] ${lastLog.q.核心知識點}</span>
                    <span class="badge ${badgeClass}">${statusText}</span>
                </div>
                <div class="text-muted small mt-1">題目：${lastLog.q.題目內容}</div>
            `;
            container.appendChild(cardDiv);
        });

        const actionArea = document.getElementById("prereq-action-area");
        if (currentPrereqQueue.length > 0) {
            actionArea.classList.remove("d-none");
            document.getElementById("prereq-explanation-text").innerText = 
                `系統檢測到您有 ${currentPrereqQueue.length} 個觀念需要追溯，將會帶您進行相對應的前置觀念測驗。`;
        } else {
            actionArea.classList.add("d-none");
        }
    }

    // 觸發階段 2（進行追溯測驗）
    function startPrereqRound() {
        currentQuestions = [...currentPrereqQueue];
        currentIndex = 0;
        document.getElementById("report-card").classList.add("d-none");
        document.getElementById("exam-card").classList.remove("d-none");
        renderQuestion();
    }

    function resetSystem() {
        document.getElementById("report-card").classList.add("d-none");
        document.getElementById("start-card").classList.remove("d-none");
    }
</script>
</body>
</html>
