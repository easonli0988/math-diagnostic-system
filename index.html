<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小知識圖譜適應性診斷系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Microsoft JhengHei', sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-custom { border-radius: 25px; padding: 12px 25px; font-weight: bold; }
        .knowledge-badge { font-size: 0.9rem; margin-right: 5px; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 800px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">國小跨學科知識圖譜適應性診斷系統</h2>
        <p class="text-muted">精準定位學習卡點 ‧ 逐層溯源診斷</p>
    </div>

    <div id="start-card" class="card p-4 text-center">
        <h4 class="mb-3">請選擇欲施測的診斷科目與單元</h4>
        <p class="text-muted">本系統將根據答題狀況，自動進行跨年級觀念的下探追溯診斷。</p>
        <div class="d-flex justify-content-center flex-wrap gap-3 mt-3">
            <button class="btn btn-primary btn-lg btn-custom" onclick="startMainExam('數學題目庫', '數學')">開始 數學 診斷測驗</button>
            <button class="btn btn-success btn-lg btn-custom" onclick="startMainExam('英文題目庫', '英文')">開始 英文 診斷測驗</button>
            <button class="btn btn-warning btn-lg btn-custom text-white" onclick="startMainExam('國語題目庫', '國語')">開始 國語 診斷測驗</button>
        </div>
    </div>

    <div id="exam-card" class="card p-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-primary fs-6" id="stage-badge">階段一：主測驗</span>
            <span class="text-muted" id="progress-text">題目 1 / 5</span>
        </div>
        <h5 class="fw-bold mb-3" id="question-title">載入中...</h5>
        <p class="fs-5 mb-4" id="question-content"></p>
        <div id="options-container" class="d-grid gap-2 mb-4"></div>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button id="prev-btn" class="btn btn-outline-secondary btn-custom" onclick="prevQuestion()">上一題</button>
            <button id="next-btn" class="btn btn-success btn-custom" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

    <div id="report-card" class="card p-4 d-none">
        <h3 class="fw-bold text-center text-primary mb-3" id="report-title">知識圖譜診斷報告</h3>
        <hr>
        
        <div id="summary-container" class="mb-4"></div>

        <h5 class="fw-bold text-dark mb-3">完整作答歷程明細：</h5>
        <div id="item-breakdown-container" class="mb-4"></div>

        <div id="prereq-action-area" class="text-center p-4 bg-light border border-warning rounded d-none">
            <h5 class="fw-bold text-dark mb-2">發現尚需進一步確認的知識卡點</h5>
            <p class="text-muted mb-3" id="prereq-explanation-text">點擊下方按鈕開始進行下一階段的前置觀念追溯測驗。</p>
            <button class="btn btn-warning btn-lg btn-custom text-white fw-bold" onclick="startPrereqRound()">進入階段 2：前置觀念追溯測驗</button>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-outline-primary btn-custom" onclick="resetSystem()">回到科目選單</button>
        </div>
    </div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwM_5-0QhMjiFhm39R5wuICWOvCOO5zm0Ftoh03iYg9NOEt_EulgmKKFHCPCPTard8/exec";

    let currentSubjectName = "";
    let allDbQuestions = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};
    let activeChains = {};
    let currentPrereqQueue = [];

    // 開始主測驗
    async function startMainExam(sheetName, subjectDisplayName) {
        currentSubjectName = subjectDisplayName;
        document.getElementById("start-card").classList.add("d-none");
        document.getElementById("exam-card").classList.remove("d-none");
        document.getElementById("question-title").innerText = "資料載入中，請稍候...";
        
        try {
            const fetchUrl = `${GAS_API_URL}?subject=${encodeURIComponent(sheetName)}`;
            const response = await fetch(fetchUrl);
            allDbQuestions = await response.json();
            
            if (allDbQuestions.error) {
                alert("試算表讀取錯誤：" + allDbQuestions.error);
                resetSystem();
                return;
            }

            currentQuestions = allDbQuestions.filter(q => String(q.年級).trim() === "6");
            
            if (currentQuestions.length === 0) {
                alert(`未在『${sheetName}』工作表中找到年級為 6 的題目，請檢查試算表！`);
                resetSystem();
                return;
            }

            currentIndex = 0;
            userAnswers = {};
            activeChains = {};
            
            currentQuestions.forEach(q => {
                activeChains[q.題目ID] = { mainQ: q, lastTestedQ: q, history: [] };
            });
            
            renderQuestion();
        } catch (error) {
            alert("載入題目失敗！請確認 GAS 部署狀態與網路連線。");
            console.error(error);
            resetSystem();
        }
    }

    // 渲染題目
    function renderQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById("stage-badge").innerText = `【${currentSubjectName}】${q.年級}年級 - ${q.核心知識點}`;
        document.getElementById("progress-text").innerText = `題目 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById("question-title").innerText = `【${q.題目ID}】 ${q.核心知識點}`;
        document.getElementById("question-content").innerText = q.題目內容;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        const rawOptions = [
            { key: 'A', text: q.選項A },
            { key: 'B', text: q.選項B },
            { key: 'C', text: q.選項C },
            { key: 'D', text: q.選項D }
        ];

        rawOptions.forEach(opt => {
            let cleanText = String(opt.text || '').replace(/^\([A-D]\)\s*/, '');
            const btn = document.createElement("button");
            btn.className = (userAnswers[q.題目ID] === opt.key) 
                ? "btn btn-primary text-start p-3 fs-6" 
                : "btn btn-outline-primary text-start p-3 fs-6";
            btn.innerText = `(${opt.key}) ${cleanText}`;
            btn.onclick = () => { userAnswers[q.題目ID] = opt.key; renderQuestion(); };
            container.appendChild(btn);
        });

        document.getElementById("prev-btn").disabled = (currentIndex === 0);
        document.getElementById("next-btn").disabled = !userAnswers[q.題目ID];
        document.getElementById("next-btn").innerText = (currentIndex === currentQuestions.length - 1) ? "完成交卷" : "下一題";
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

    function nextQuestion() {
        if (currentIndex < currentQuestions.length - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            processRoundResults();
        }
    }

    // 處理交卷結果與判定階段 2 追溯題目
    function processRoundResults() {
        currentPrereqQueue = [];
        
        currentQuestions.forEach(q => {
            const userAns = userAnswers[q.題目ID];
            const isCorrect = (String(userAns).trim().toUpperCase() === String(q.正確答案).trim().toUpperCase());
            
            let chainKey = Object.keys(activeChains).find(k => k === q.題目ID || activeChains[k].lastTestedQ.題目ID === q.題目ID);
            if (chainKey) {
                let chain = activeChains[chainKey];
                chain.history.push({ q: q, isCorrect: isCorrect });
                
                if (!isCorrect) {
                    const nextPrereqId = q.前置追溯題目ID;
                    if (nextPrereqId && String(nextPrereqId).trim() !== "無" && String(nextPrereqId).trim() !== "") {
                        const nextQ = allDbQuestions.find(item => String(item.題目ID).trim() === String(nextPrereqId).trim());
                        if (nextQ) {
                            chain.lastTestedQ = nextQ;
                            currentPrereqQueue.push(nextQ);
                        }
                    }
                }
            }
        });

        renderDiagnosisReport();
    }

    // 渲染診斷報告
    function renderDiagnosisReport() {
        document.getElementById("exam-card").classList.add("d-none");
        document.getElementById("report-card").classList.remove("d-none");
        document.getElementById("report-title").innerText = `${currentSubjectName}科 知識圖譜診斷報告`;
        
        const summaryContainer = document.getElementById("summary-container");
        const breakdownContainer = document.getElementById("item-breakdown-container");
        summaryContainer.innerHTML = "";
        breakdownContainer.innerHTML = "";

        let weakConcepts = [];

        Object.keys(activeChains).forEach(chainKey => {
            const chain = activeChains[chainKey];
            const wrongLogs = chain.history.filter(h => !h.isCorrect);

            if (wrongLogs.length > 0) {
                const mainConcept = chain.mainQ.核心知識點;
                const wrongGrades = wrongLogs.map(l => `${l.q.年級}年級`).join('與 ');
                weakConcepts.push({
                    concept: mainConcept,
                    details: `在【${mainConcept}】單元中，${wrongGrades}的概念題目均出現答錯狀況，建議針對此觀念進行複習。`
                });
            }
        });

        if (weakConcepts.length > 0) {
            let summaryHTML = `<div class="alert alert-danger shadow-sm">
                <h5 class="fw-bold alert-heading">⚠️ 經系統分析，發現以下 ${currentSubjectName} 知識點需加強：</h5><hr>`;
            weakConcepts.forEach(item => {
                summaryHTML += `<p class="mb-2"><strong>• ${item.concept}：</strong>${item.details}</p>`;
            });
            summaryHTML += `</div>`;
            summaryContainer.innerHTML = summaryHTML;
        } else {
            summaryContainer.innerHTML = `<div class="alert alert-success shadow-sm text-center">
                <h5 class="fw-bold mb-0">🎉 太棒了！您的 ${currentSubjectName} 核心觀念非常紮實，沒有發現明顯學習卡點！</h5>
            </div>`;
        }

        Object.keys(activeChains).forEach(chainKey => {
            const chain = activeChains[chainKey];
            
            chain.history.forEach(log => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "card mb-2 p-3 border-start border-4 " + (log.isCorrect ? "border-success" : "border-danger");
                const badgeClass = log.isCorrect ? "bg-success" : "bg-danger";
                const statusText = log.isCorrect ? "答對" : "答錯";
                
                cardDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-secondary knowledge-badge">${log.q.年級}年級</span>
                            <span class="fw-bold text-dark">${log.q.核心知識點}</span>
                            <span class="text-muted small">【${log.q.題目ID}】</span>
                        </div>
                        <span class="badge ${badgeClass} fs-6">${statusText}</span>
                    </div>
                    <div class="text-secondary small mt-2">題目：${log.q.題目內容}</div>
                `;
                breakdownContainer.appendChild(cardDiv);
            });
        });

        const actionArea = document.getElementById("prereq-action-area");
        if (currentPrereqQueue.length > 0) {
            actionArea.classList.remove("d-none");
            document.getElementById("prereq-explanation-text").innerText = 
                `系統檢測到您有 ${currentPrereqQueue.length} 個 ${currentSubjectName} 觀念答錯，點擊下方按鈕開始進行適應性前置觀念追溯測驗。`;
        } else {
            actionArea.classList.add("d-none");
        }
    }

    // 觸發階段 2
    function startPrereqRound() {
        currentQuestions = [...currentPrereqQueue];
        currentIndex = 0;
        userAnswers = {};
        document.getElementById("report-card").classList.add("d-none");
        document.getElementById("exam-card").classList.remove("d-none");
        renderQuestion();
    }

    function resetSystem() {
        document.getElementById("report-card").classList.add("d-none");
        document.getElementById("exam-card").classList.add("d-none");
        document.getElementById("start-card").classList.remove("d-none");
    }
</script>
</body>
</html>
